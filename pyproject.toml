[tool.poetry]
name = "gnuplot-advanced"
version = "0.1.1"
description = "Advanced Gnuplot utilities for Gnuplot power users"
authors = ["Neil Temperley"]
packages = [{ include = "gnuplot_advanced", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"


