[tool.poetry]
name = "gnuplot-advanced"
version = "0.1.1"
description = "Advanced Gnuplot utilities for Gnuplot power users"
authors = ["Neil Temperley"]
license = "MIT"
readme = "README.md"
packages = [{ include = "gnuplot_advanced" }]

[tool.poetry.dependencies]
python = "^3.10"
# NOTE: Put this in the consuming project toml gnuplot-advanced = {path = "../Gnuplot_Advanced", develop = true}
# and/or run from consumer poetry shell for example: poetry add --editable ../Gnuplot_Advanced

[tool.poetry.dev-dependencies]
pytest = "^7.0"  # Optional for testing

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

