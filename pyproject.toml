# Useful:
# poetry check
# poetry show --outdated
# toml-sort -i pyproject.toml

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
  "pytest>=7.0,<8.0",
  "flake8>=7.3.0,<8.0.0",
  "isort>=9.0.0,<10.0.0"
]

[project]
name = "gnuplot-snippets"
version = "0.1.6"
description = "Composable gnuplot snippets for Python, for interactive and batch plotting by advanced users"
keywords = ["gnuplot", "plotting", "snippets", "visualization"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Neil Temperley" }
]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.3"
]

[project.scripts]
gnuplot-snippets-demo = "gnuplot_snippets.demo:main"

[project.urls]
Repository = "https://github.com/neiltemperley/gnuplot-snippets"
Licence = "https://github.com/neiltemperley/gnuplot-snippets/blob/main/LICENSE"

[tool.poetry]
packages = [{ include = "gnuplot_snippets", from = "src" }]
